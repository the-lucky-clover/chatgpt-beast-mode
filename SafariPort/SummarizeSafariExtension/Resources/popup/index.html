<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT Beast Mode</title>
    <link rel="stylesheet" href="../options/index.css" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="batch-results.css" />
  </head>
  <body>
    <div class="popup-container">
      <header class="popup-header">
        <div class="header-content">
          <div class="header-wordmark">
            <div class="logo" aria-hidden="true">🤖</div>
            <h1 class="header-title shimmer-text">ChatGPT Beast Mode</h1>
          </div>

          <div class="header-actions">
            <button id="batch-tab-btn" class="icon-btn" type="button" role="tab" aria-selected="false" aria-label="Batch Summaries" title="Batch Summaries">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </button>
            <div class="text-size-control">
              <button id="text-size-btn" class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Adjust text size" title="Text size">
                <span class="aa-icon" aria-hidden="true">Aa</span>
              </button>
              <div id="text-size-popover" class="popover hidden" role="dialog" aria-label="Text size">
                <label class="popover-label" for="text-size-slider">Text size</label>
                <div class="slider-row">
                  <span class="slider-icon small" aria-hidden="true">A</span>
                  <input id="text-size-slider" class="text-size-slider" type="range" min="85" max="130" step="5" value="100" aria-label="Text size percentage" />
                  <span class="slider-icon large" aria-hidden="true">A</span>
                </div>
                <div class="popover-value"><span id="text-size-value">100</span>%</div>
              </div>
            </div>

            <button id="theme-toggle-btn" class="icon-btn theme-toggle" type="button" aria-pressed="false" aria-label="Toggle dark mode" title="Switch light/dark using the default palette">
              <span class="theme-toggle-track">
                <span class="theme-toggle-thumb">
                  <svg class="icon-sun" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
                  <svg class="icon-moon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
                </span>
              </span>
            </button>
            <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings" title="Settings">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 3 3-1 2 2 3-1 1-3 3-1 1-3-2-2 1-3-3-2-3 1-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button id="close-btn" class="icon-btn" type="button" aria-label="Close popup" title="Close popup">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </div>
      </header>

      <main class="popup-main">
        <div id="app"></div>
      </main>

      <!-- Batch Summaries Tab Panel (hidden by default) -->
      <section id="batch-panel" class="panel hidden" aria-hidden="true">
        <header class="panel-header glass">
          <h2 class="panel-title">📊 Batch Summaries</h2>
          <div class="panel-actions">
            <select id="batch-sort-select" class="glass-chip" aria-label="Sort batch results">
              <option value="chrono">📅 Chronological</option>
              <option value="az">🔤 A–Z</option>
              <option value="usage">📊 Usage</option>
            </select>
            <button id="batch-export-btn" class="btn glass-btn primary" aria-label="Export as CSV">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              <span>Export</span>
            </button>
            <button id="batch-close-btn" class="btn glass-btn ghost" aria-label="Close batch panel">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </header>
        <div class="panel-stats glass" id="batch-stats" aria-live="polite">
          <div class="stat"><span class="stat-value" id="batch-total">0</span><span class="stat-label">Total</span></div>
          <div class="stat"><span class="stat-value success" id="batch-success">0</span><span class="stat-label">Success</span></div>
          <div class="stat"><span class="stat-value error" id="batch-errors">0</span><span class="stat-label">Failed</span></div>
          <div class="stat"><span class="stat-value" id="batch-windows">0</span><span class="stat-label">Windows</span></div>
        </div>
        <div class="batch-table-container">
          <table class="batch-table glass" id="batch-table" role="grid" aria-label="Batch summarization results">
            <thead>
              <tr>
                <th scope="col" data-sort="chrono">⏱ Time <button class="sort-btn" data-sort="chrono" aria-label="Sort by time">⇅</button></th>
                <th scope="col">🖼 Preview</th>
                <th scope="col" data-sort="url">🔗 URL <button class="sort-btn" data-sort="url" aria-label="Sort by URL">⇅</button></th>
                <th scope="col" data-sort="az">📄 Title / Summary <button class="sort-btn" data-sort="az" aria-label="Sort by title">⇅</button></th>
                <th scope="col">📊 Progress</th>
                <th scope="col">⚡ Actions</th>
              </tr>
            </thead>
            <tbody id="batch-tbody"></tbody>
          </table>
        </div>
        <div class="empty-state glass" id="batch-empty" hidden>
          <svg class="empty-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="8" stroke="currentColor" stroke-width="2"/><path d="M16 22h32M16 32h24M16 42h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <h3>No Batch Results</h3>
          <p>Right-click extension icon → choose a batch option</p>
        </div>
      </section>
    </div>
    <script src="header.js" type="module"></script>
    <script src="index.js" type="module"></script>
    <script src="batch-results.js" type="module"></script>
  </body>
</html>
