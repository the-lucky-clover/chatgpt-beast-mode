<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT Beast Mode</title>
    <link rel="stylesheet" href="../options/index.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="popup-container">
      <header class="popup-header">
        <div class="header-content">
          <div class="header-wordmark">
            <div class="logo" aria-hidden="true">🤖</div>
            <h1 class="header-title shimmer-text">ChatGPT Beast Mode</h1>
          </div>

          <div class="header-actions">
            <div class="text-size-control">
              <button id="text-size-btn" class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Adjust text size" title="Text size">
                <span class="aa-icon" aria-hidden="true">Aa</span>
              </button>
              <div id="text-size-popover" class="popover hidden" role="dialog" aria-label="Text size">
                <label class="popover-label" for="text-size-slider">Text size</label>
                <div class="slider-row">
                  <span class="slider-icon small" aria-hidden="true">A</span>
                  <input id="text-size-slider" class="text-size-slider" type="range" min="85" max="130" step="5" value="100" aria-label="Text size percentage" />
                  <span class="slider-icon large" aria-hidden="true">A</span>
                </div>
                <div class="popover-value"><span id="text-size-value">100</span>%</div>
              </div>
            </div>

            <button id="theme-toggle-btn" class="icon-btn theme-toggle" type="button" aria-pressed="false" aria-label="Toggle dark mode" title="Switch light/dark using the default palette">
              <span class="theme-toggle-track">
                <span class="theme-toggle-thumb">
                  <svg class="icon-sun" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
                  <svg class="icon-moon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
                </span>
              </span>
            </button>
            <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings" title="Settings">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 3 3-1 2 2 3-1 1-3 3-1 1-3-2-2 1-3-3-2-3 1-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button id="close-btn" class="icon-btn" type="button" aria-label="Close popup" title="Close popup">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </div>
      </header>

      <main class="popup-main">
        <div id="app"></div>
      </main>
    </div>
    <script src="header.js" type="module"></script>
    <script src="index.js" type="module"></script>
  </body>
</html>
